<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#7b2d52"/>
<title>Cœur·Lingo — Learn German</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<style>
:root{
  --coral:#ff6b6b; --coral-d:#e8516a; --plum:#7b2d52; --plum-d:#5a1f3c;
  --gold:#f4b942; --bg:#fff7f3; --card:#ffffff; --ink:#2c1a24; --muted:#8a6f7c;
  --good:#28a878; --bad:#e8516a; --line:#f0dfe4; --shadow:0 6px 22px rgba(123,45,82,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.45;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}
button{font-family:inherit;cursor:pointer;border:none}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--plum),var(--plum-d));
  color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;letter-spacing:.3px;font-size:18px;display:flex;align-items:center;gap:7px}
.streakpill{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 11px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px}
.iconbtn{background:rgba(255,255,255,.14);color:#fff;border-radius:10px;width:38px;height:38px;font-size:18px}
.xpbar{height:7px;background:rgba(255,255,255,.2);border-radius:999px;margin-top:12px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .5s}
.xpmeta{display:flex;justify-content:space-between;font-size:12px;opacity:.9;margin-top:5px}
.lvlbar{height:6px;background:rgba(255,255,255,.2);border-radius:999px;margin-top:4px;overflow:hidden}
.lvlbar>i{display:block;height:100%;background:#9be7c4;border-radius:999px;transition:width .5s}
main{padding:16px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h2{font-size:17px}
.muted{color:var(--muted)}.sm{font-size:13px}.center{text-align:center}
.big-cta{width:100%;background:linear-gradient(135deg,var(--coral),var(--coral-d));color:#fff;
  font-size:18px;font-weight:800;padding:18px;border-radius:16px;box-shadow:0 8px 20px rgba(232,81,106,.35)}
.big-cta:active{transform:scale(.98)}
.btn{background:var(--plum);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;font-size:15px}
.btn.ghost{background:#fff;color:var(--plum);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#5a3a00}
.btn.block{width:100%;display:block;text-align:center}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}.row>*{flex:1}
.compliment{background:linear-gradient(135deg,#fff,#fff0f4);border:1.5px dashed var(--coral);
  border-radius:16px;padding:14px 16px;font-style:italic;color:var(--plum);font-weight:600;margin-bottom:14px}
.chk{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:none}
.chk .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px;color:#fff}
.chk.done .box{background:var(--good);border-color:var(--good)}
.chk.done .lbl{text-decoration:line-through;color:var(--muted)}
.chk .lbl{flex:1;font-weight:600;font-size:15px}.chk .xp{font-size:12px;color:var(--gold);font-weight:800}
.sprog{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
.sprog>i{display:block;height:100%;background:var(--coral);transition:width .4s}
.flash{font-size:13px;font-weight:700;padding:10px 12px;border-radius:10px;margin-top:12px}
.flash.ok{background:#e7f7ef;color:var(--good)}.flash.no{background:#fdeaee;color:var(--bad)}
.qtext{font-size:20px;font-weight:700;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:10px;font-size:16px;font-weight:600}
.opt.right{border-color:var(--good);background:#e7f7ef}
.opt.wrong{border-color:var(--bad);background:#fdeaee}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;min-height:50px}
.chip{background:var(--plum);color:#fff;padding:10px 13px;border-radius:10px;font-weight:700;font-size:15px}
.chip.pool{background:#fff;color:var(--plum);border:1.5px solid var(--line)}
.flip{perspective:1000px;height:190px;margin-bottom:14px}
.flip-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;
  text-align:center;padding:18px;border:1.5px solid var(--line);background:#fff}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,#fff,#fff3f6)}
.face .big{font-size:26px;font-weight:800;color:var(--plum)}
.spk{background:var(--gold);color:#5a3a00;border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.bigspk{background:var(--gold);color:#5a3a00;border-radius:16px;padding:22px;font-weight:800;font-size:18px;width:100%;display:flex;gap:10px;align-items:center;justify-content:center}
.lg{display:flex;align-items:center;gap:12px;padding:11px 6px;border-radius:12px}
.lg.me{background:#fff3f6;border:1.5px solid var(--coral)}
.lg .rk{width:26px;font-weight:800;color:var(--muted);text-align:center}
.lg .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#f3e6ec}
.lg .nm{flex:1;font-weight:700}.lg .pts{font-weight:800;color:var(--plum)}
.svgwrap{width:100%;overflow:hidden}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat span{aspect-ratio:1;border-radius:5px;background:#f0dfe4}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff3f6;border-radius:14px;padding:12px;text-align:center}
.stat b{font-size:24px;color:var(--plum);display:block}
.badge{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px}
.badge .ic{font-size:26px;filter:grayscale(1);opacity:.35}
.badge.on .ic{filter:none;opacity:1}.badge.on{border-color:var(--gold);background:#fffaf0}
/* Badge-Fortschrittsreihen (S9) */
.badgerow{display:flex;gap:11px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.badgerow:last-child{border-bottom:none}
.badgerow .bicon{font-size:24px;width:34px;text-align:center;flex:none;filter:grayscale(1);opacity:.4}
.badgerow.on .bicon{filter:none;opacity:1}
.badgerow .bmeta{flex:1;min-width:0}
.badgerow .bname{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.badgerow .btier{font-size:11px;font-weight:800;color:var(--gold);background:#fffaf0;border-radius:6px;padding:1px 7px;flex:none}
.bbar{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin:5px 0 3px}
.bbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--gold));border-radius:999px;transition:width .5s}
.coupon{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.coupon.on{border-color:var(--gold);background:linear-gradient(135deg,#fffaf0,#fff)}
.coupon.locked{opacity:.55}
.coupon .d{font-size:24px;font-weight:800;color:var(--coral);width:54px;text-align:center;flex:none}
.coupon .t{flex:1}.coupon .t b{display:block}
.coupon .st{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--gold)}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40}
nav button{flex:1;background:none;padding:9px 0 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ni{font-size:21px}
nav button.on{color:var(--plum);font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(44,26,36,.55);z-index:60;display:grid;place-items:center;padding:22px;animation:fade .2s}
.sheet{background:#fff;border-radius:22px;padding:24px;max-width:460px;width:100%;text-align:center;box-shadow:var(--shadow)}
.sheet .emo{font-size:60px;animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
input,select{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;margin-bottom:12px;background:#fff}
label{font-weight:700;font-size:14px;display:block;margin-bottom:5px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:55}
.tag{display:inline-block;background:#f3e6ec;color:var(--plum);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin:2px 2px 8px 0}
.step{display:flex;gap:11px;margin-bottom:13px}.step .n{width:26px;height:26px;border-radius:50%;background:var(--plum);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;font-size:14px}
code{background:#f3e6ec;padding:2px 6px;border-radius:6px;font-size:13px;color:var(--plum-d);word-break:break-all}
.match{display:flex;gap:10px}.match .col{flex:1;display:flex;flex-direction:column;gap:8px}
.pairbtn{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 10px;font-weight:600;font-size:14px;text-align:center}
.pairbtn.sel{border-color:var(--plum);background:#fff3f6}
.pairbtn.ok{border-color:var(--good);background:#e7f7ef;opacity:.6}
.pairbtn.err{border-color:var(--bad);background:#fdeaee}
.lvltag{font-size:11px;font-weight:800;color:#9be7c4;background:rgba(0,0,0,.04);border-radius:6px;padding:1px 6px}
/* Easter-Egg-Streaks (S10) */
.eggcard{border:1.5px solid var(--gold)!important;background:linear-gradient(135deg,#fffaf0,#fff3f6)!important;text-align:center}
.owlcard{display:flex;align-items:center;gap:12px;cursor:pointer;border:1.5px solid var(--gold);background:#fffaf0}
.owl{font-size:30px;animation:owlbob 2.4s ease-in-out infinite}
@keyframes owlbob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}
body.goldday header{background:linear-gradient(135deg,var(--gold),#d99414)}
body.goldday .brand{color:#5a3a00}
/* Wort-Antippen (S8) */
span.w{border-bottom:1.5px dotted var(--coral);cursor:pointer}
#wordpopup{position:fixed;left:0;right:0;bottom:0;z-index:95;padding:10px 14px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
#wordpopup .wpcard{pointer-events:auto}
.wpcard{position:relative;width:100%;max-width:520px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 44px 16px 16px;animation:fade .2s ease}
.wpclose{position:absolute;top:10px;right:10px;background:#fff3f6;border:1.5px solid var(--line);border-radius:8px;width:28px;height:28px;font-size:14px;color:var(--plum)}
.wpword{font-size:19px;font-weight:800;color:var(--plum);display:flex;align-items:center;gap:8px}
.wptrans{font-size:15px;color:var(--good);font-weight:600;margin-top:4px}
.wpspk{background:var(--gold);color:#5a3a00;border-radius:999px;padding:4px 11px;font-weight:700;font-size:13px}
.envar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.envar:last-child{border-bottom:none}
.envar.fit{background:#fffaf0;margin:0 -8px;padding:8px;border-radius:10px;border:1px solid var(--gold)}
.fitchip{background:var(--gold);color:#5a3a00;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;margin-left:7px;vertical-align:middle;white-space:nowrap}
/* Feedback-Button (S11) */
#feedbackoverlay{position:fixed;inset:0;z-index:96;background:rgba(44,26,36,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.fbcard{position:relative;width:100%;max-width:460px;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:22px 40px 20px 22px;text-align:left;animation:fade .2s ease}
.fbclose{position:absolute;top:14px;right:14px;background:#fff3f6;border:1.5px solid var(--line);border-radius:8px;width:28px;height:28px;font-size:14px;color:var(--plum)}
.fbshot{width:100%;border-radius:12px;border:1.5px solid var(--line);margin:12px 0 8px}
.fbcard textarea{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;resize:vertical;margin-top:4px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand">💞 Cœur·Lingo</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="streakpill">🔥 <span id="hStreak">0</span></div>
      <button class="iconbtn" onclick="openFeedback()" title="Report a bug or send feedback">🐞</button>
      <button class="iconbtn" onclick="show('settings')">⚙️</button>
    </div>
  </div>
  <div class="xpbar"><i id="hXp" style="width:0"></i></div>
  <div class="xpmeta"><span id="hXpToday">0 / 50 XP</span><span id="hLevel">A2</span></div>
  <div class="lvlbar"><i id="hLvlProg" style="width:0"></i></div>
</header>

<main>
  <section id="view-home" class="view"></section>
  <section id="view-session" class="view hidden"></section>
  <section id="view-liga" class="view hidden"></section>
  <section id="view-stats" class="view hidden"></section>
  <section id="view-reward" class="view hidden"></section>
  <section id="view-settings" class="view hidden"></section>
  <section id="view-blocker" class="view hidden"></section>
</main>

<nav>
  <button data-nav="home" class="on" onclick="show('home')"><span class="ni">🏠</span><span class="nl" data-k="nav_home"></span></button>
  <button data-nav="liga" onclick="show('liga')"><span class="ni">🏆</span><span class="nl" data-k="nav_liga"></span></button>
  <button data-nav="reward" onclick="show('reward')"><span class="ni">🎁</span><span class="nl" data-k="nav_reward"></span></button>
  <button data-nav="stats" onclick="show('stats')"><span class="ni">📈</span><span class="nl" data-k="nav_stats"></span></button>
</nav>

<canvas id="confetti" class="hidden"></canvas>
<div id="modal-root"></div>
<div id="wordpopup" class="hidden"></div>
<div id="feedbackoverlay" class="hidden"></div>

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
function todayStr(d=new Date()){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}
function addDays(s,n){const d=new Date(s);d.setDate(d.getDate()+n);return todayStr(d);}
function dayIndex(){return daysBetween("2026-01-01",todayStr());}
function weekKey(s){const d=new Date(s);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return todayStr(d);}
function rnd(a,b){return a+Math.random()*(b-a);}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function levelIdx(l){return LEVELS.indexOf(l);}

function planForDay(){
  const seed=dayIndex();
  const rotA=["uebersetzen","satzbau"][seed%2];
  const rotB=["luecke","hoeren","konjugation"][seed%3];
  return ["vocab",rotA,rotB,"dialog","grammatik","paare"];
}
function ensureChecklist(){
  const tt=todayStr();
  if(!S.checkliste||S.checkliste.datum!==tt){
    S.checkliste={datum:tt,plan:planForDay()};
    S.checkliste.items=S.checkliste.plan.map(ty=>({ty,erledigt:false}));save();
  }
}
function checklistDone(){return S.checkliste.items.every(i=>i.erledigt);}

/* ---------- XP / SRS ---------- */
function rolloverXp(){const tt=todayStr();if(S.xp.heuteDatum!==tt){S.xp.heute=0;S.xp.heuteDatum=tt;}}
function addXp(n){rolloverXp();S.xp.heute+=n;S.xp.gesamt+=n;S.liga.meineXpWoche+=n;save();renderHeader();}
function srsUpdate(id,correct){
  let c=S.srs[id]||{ease:2.3,intv:0,reps:0,due:dayIndex()};
  if(correct){c.reps++;c.ease=Math.min(2.8,c.ease+0.1);c.intv=c.reps<=1?1:c.reps===2?3:Math.round(c.intv*c.ease);}
  else{c.reps=0;c.ease=Math.max(1.3,c.ease-0.2);c.intv=1;}
  c.due=dayIndex()+c.intv;S.srs[id]=c;save();
}
function isDue(id){const c=S.srs[id];return c&&c.due<=dayIndex();}
function record(correct,lvl,id,type){
  SES.total++;if(correct)SES.correct++;
  if(type)bumpCounter(type); // per-type card counters (uebersetzen/luecke/satzbau/hoeren/konjugation)
  S.recent.push(correct?1:0);if(S.recent.length>40)S.recent.shift();
  if(correct){const Lv=lvl||S.user.niveau;if(S.mastery[Lv]!=null)S.mastery[Lv]++;}
  if(id&&type){correct?clearMistake(id):addMistake(id,type);}
  save();maybeLevelUp();
}
function addMistake(id,type){S.mistakes=(S.mistakes||[]).filter(m=>m.id!==id);S.mistakes.unshift({id,type});if(S.mistakes.length>60)S.mistakes.pop();}
function clearMistake(id){S.mistakes=(S.mistakes||[]).filter(m=>m.id!==id);}
function markSeen(id){if(!S.seenIds.includes(id)){S.seenIds.push(id);S.wordsSeen++;}}
function maybeLevelUp(){
  const i=curIdx();if(i>=LEVELS.length-1)return;
  const lvl=S.user.niveau;
  if(S.mastery[lvl]>=LEVELUP_TH[lvl]){const nx=LEVELS[i+1];S.user.niveau=nx;save();grantBadge(nx.toLowerCase());SES&&(SES.leveledTo=nx);}
}
function themedPool(arr){return (SES&&SES.theme)?arr.filter(it=>it.thema===SES.theme):arr;}
function poolFor(arr){
  if(SES&&SES.mistakeSet)return arr.filter(it=>SES.mistakeSet.has(it.id));
  const ci=curIdx();return themedPool(arr).filter(it=>levelIdx(it.lvl)<=ci);
}
function pickSRS(arr,n){
  const pool=poolFor(arr);
  const due=shuffle(pool.filter(it=>isDue(it.id)));
  const fresh=shuffle(pool.filter(it=>!S.srs[it.id]));
  const seen=shuffle(pool.filter(it=>S.srs[it.id]&&!isDue(it.id)));
  const acc=recentAcc();
  const wantNew=acc>0.8?Math.ceil(n*0.6):acc<0.55?Math.floor(n*0.25):Math.ceil(n*0.45);
  const out=[];
  for(const it of due){if(out.length>=n-Math.min(wantNew,fresh.length))break;out.push(it);}
  for(const it of fresh){if(out.length>=n)break;out.push(it);}
  for(const it of due){if(out.length>=n)break;if(!out.includes(it))out.push(it);}
  for(const it of seen){if(out.length>=n)break;out.push(it);}
  return shuffle(out).slice(0,n);
}
function pickLevel(arr,n){
  const ci=curIdx(),acc=recentAcc();let pool=poolFor(arr);
  const cur=pool.filter(it=>levelIdx(it.lvl)===ci),lower=pool.filter(it=>levelIdx(it.lvl)<ci);
  let ranked=acc<0.55?[...shuffle(lower),...shuffle(cur)]:[...shuffle(cur),...shuffle(lower)];
  if(ranked.length<n)ranked=shuffle(pool);
  return ranked.slice(0,n);
}

/* ---------- complete ---------- */
/* Fehltage abrechnen (Boot + vor jedem Session-Abschluss). Je Fehltag: 1 Freeze deckt den Tag
   (Streak bleibt erhalten), ohne Freeze −3 (nie unter 0). Kein Reset-auf-1 mehr.
   S.streak.abgerechnetBis verhindert Doppel-Abzug über mehrere Boots am selben Tag. */
function reconcileStreak(){
  const tt=todayStr();
  if(S.streak.notice&&S.streak.notice.datum!==tt)delete S.streak.notice; // Notiz vom Vortag nicht ewig stehen lassen
  if(!S.streak.letzterTag)return;
  const from=(S.streak.abgerechnetBis&&S.streak.abgerechnetBis>S.streak.letzterTag)?S.streak.abgerechnetBis:S.streak.letzterTag;
  const missed=daysBetween(from,tt)-1;
  if(missed<=0)return;
  let frozen=0,reduced=0;
  for(let i=0;i<missed;i++){
    if(S.streak.freezes>0){S.streak.freezes-=1;frozen++;}
    else{const cut=Math.min(3,S.streak.aktuell);S.streak.aktuell-=cut;reduced+=cut;}
  }
  S.streak.abgerechnetBis=addDays(tt,-1);
  if(frozen||reduced)S.streak.notice={frozen,reduced,datum:tt};
  save();
}
function completeSession(durSec){
  const tt=todayStr();
  reconcileStreak(); // Notiz bleibt für den ganzen Tag sichtbar (auch über die erste Session hinaus), verschwindet erst beim nächsten Tageswechsel von selbst
  if(S.streak.letzterTag!==tt){
    S.streak.aktuell+=1;
    S.streak.letzterTag=tt;S.streak.längste=Math.max(S.streak.längste,S.streak.aktuell);
  }
  S.sessions.push({datum:tt,dauerSek:durSec,xp:SES.correct*5,aufgaben:SES.total,genauigkeit:SES.total?Math.round(SES.correct/SES.total*100):0});
  addXp(20);
  if(SES.total>0&&SES.correct===SES.total)bumpCounter("perfectSessions");
  if(SES.bonus)bumpCounter("themedSessions");
  const h=new Date().getHours();if(h<8)bumpCounter("earlySessions");if(h>=22)bumpCounter("lateSessions");
  const dow=new Date().getDay();if(dow===0||dow===6)bumpCounter("weekendSessions");
  const nb=checkBadges(),nc=checkCoupons(),egg=checkEasterEggs(),lvl=SES.leveledTo;
  advanceLiga();save();celebrate(nb,nc,lvl,egg);
}
function checkEasterEggs(){
  let revealed=null;
  EASTER_EGGS.forEach(e=>{
    if(S.streak.aktuell>=e.day&&!S.eggs.revealed[e.day]){
      S.eggs.revealed[e.day]=todayStr();
      if(e.effect==="gold")S.eggs.goldDate=todayStr();
      if(e.effect==="owl")S.eggs.owl=true;
      if(e.mail)sendMail(e.msubj(S.user.name),e.mbody(S.user.name),"egg_"+e.day);
      revealed=e;
    }
  });
  save();return revealed;
}
function nextEggTeaser(){
  for(const e of EASTER_EGGS){
    if(!S.eggs.revealed[e.day]){const away=e.day-S.streak.aktuell;if(away>=1&&away<=3)return away;}
  }
  return 0;
}
function hasBadge(id){return S.badges.some(b=>b.id===id);}
function grantBadge(id){if(!hasBadge(id)){S.badges.push({id,datum:todayStr()});save();return true;}return false;}
function bumpCounter(key,n){S.counters[key]=(S.counters[key]||0)+(n||1);}
function checkBadges(){
  const got=[];
  BADGE_CATALOG.forEach(c=>{const v=c.get();c.th.forEach((th,i)=>{if(v>=th&&grantBadge(c.cat+"_"+i))got.push({id:c.cat+"_"+i,ic:c.icon,name:c.name+" "+th});});});
  BADGE_SPECIAL.forEach(s=>{if(s.when()&&grantBadge(s.id))got.push({id:s.id,ic:s.icon,name:s.name});});
  return got;
}
function badgeEarnedCount(){let n=0;BADGE_CATALOG.forEach(c=>n+=badgeTier(c));BADGE_SPECIAL.forEach(s=>{if(hasBadge(s.id))n++;});return n;}
function badgeTotalCount(){let n=BADGE_SPECIAL.length;BADGE_CATALOG.forEach(c=>n+=c.th.length);return n;}
function badgeGridHTML(){
  const cats=BADGE_CATALOG.map(c=>{
    const val=c.get(),tier=badgeTier(c),max=c.th.length;
    const nextTh=c.th[tier],prevTh=tier>0?c.th[tier-1]:0;
    const pct=nextTh?Math.max(0,Math.min(100,Math.round((val-prevTh)/(nextTh-prevTh)*100))):100;
    return `<div class="badgerow ${tier>0?'on':''}"><span class="bicon">${c.icon}</span><div class="bmeta">
      <div class="bname"><span>${esc(c.name)}</span><span class="btier">${tier}/${max}</span></div>
      <div class="bbar"><i style="width:${pct}%"></i></div>
      <div class="muted sm">${nextTh?`${val} / ${nextTh}`:t("badge_maxed")}</div></div></div>`;
  }).join("");
  const specials=BADGE_SPECIAL.map(s=>{const on=hasBadge(s.id);
    return `<div class="badgerow ${on?'on':''}"><span class="bicon">${s.icon}</span><div class="bmeta">
      <div class="bname"><span>${esc(s.name)}</span><span class="btier">${on?"✓":"–"}</span></div></div></div>`;
  }).join("");
  return cats+specials;
}
function checkCoupons(){
  let g=null;
  MILESTONES.forEach(m=>{if(S.streak.aktuell>=m&&!S.coupons.some(c=>c.meilenstein===m)){S.coupons.push({meilenstein:m,status:"verdient",datum:todayStr()});g=m;}});
  save();return g;
}
function advanceLiga(){
  const tt=todayStr(),wk=weekKey(tt);
  if(S.liga.week!==wk){S.liga.week=wk;S.liga.meineXpWoche=0;S.liga.npcs.forEach(n=>n.xpWoche=Math.round(rnd(0,n.rate)));}
  const gap=Math.max(0,daysBetween(S.liga.lastTag,tt));
  for(let d=0;d<gap;d++)S.liga.npcs.forEach(n=>{let g=rnd(n.rate*0.5,n.rate*1.4);if(n.xpWoche>S.liga.meineXpWoche+40)g*=0.55;if(n.xpWoche<S.liga.meineXpWoche-40)g*=1.4;n.xpWoche+=Math.round(g);});
  S.liga.lastTag=tt;
  if(ligaSorted()[0].me&&S.counters.leagueWeekCounted!==wk){bumpCounter("leagueWins");S.counters.leagueWeekCounted=wk;} // max. 1 Liga-Sieg pro Woche zählen
  save();
}
function ligaSorted(){
  const a=[...S.liga.npcs.map(n=>({name:n.name,av:n.av,pts:n.xpWoche,me:false})),{name:S.user.name||"You",av:"💖",pts:S.liga.meineXpWoche,me:true}];

/* ---------- Feedback-Button (S11): 🐞 + html2canvas (self-hosted) + 50-entry error ring buffer + offline queue.
   No backend: reports go via the existing Web3Forms/freundEmail infra, same as coupon/badge mails. ---------- */
const APP_VERSION="v12"; // muss mit sw.js' CACHE-Version mitgezogen werden (bei jedem Cache-Bump anpassen)
const ERRBUF_KEY="dl_errbuf",FBQUEUE_KEY="dl_fbqueue";
function pushErrBuf(entry){
  let buf=[];try{buf=JSON.parse(localStorage.getItem(ERRBUF_KEY))||[];}catch(e){buf=[];}
  buf.push(Object.assign({ts:Date.now()},entry));
  if(buf.length>50)buf=buf.slice(-50);
  try{localStorage.setItem(ERRBUF_KEY,JSON.stringify(buf));}catch(e){}
}
function getErrBuf(){try{return JSON.parse(localStorage.getItem(ERRBUF_KEY))||[];}catch(e){return [];}}
window.addEventListener("error",e=>pushErrBuf({type:"error",message:String(e.message||""),source:e.filename||"",line:e.lineno||0}));
window.addEventListener("unhandledrejection",e=>pushErrBuf({type:"unhandledrejection",message:String((e.reason&&e.reason.message)||e.reason||"")}));
(function(){
  const orig=console.error;
  console.error=function(){try{pushErrBuf({type:"console.error",message:Array.prototype.slice.call(arguments).map(String).join(" ").slice(0,500)});}catch(e){}return orig.apply(console,arguments);};
})();

let FEEDBACK=null;
function loadHtml2Canvas(){
  if(window.html2canvas)return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="html2canvas.min.js";s.onload=()=>resolve();s.onerror=()=>reject(new Error("load failed"));
    document.head.appendChild(s);
  });
}
function currentViewName(){return ["home","session","liga","stats","reward","settings","blocker"].find(v=>!document.getElementById("view-"+v).classList.contains("hidden"))||"unknown";}
async function captureScreenshot(){
  try{
    await loadHtml2Canvas();
    const canvas=await window.html2canvas(document.body,{backgroundColor:"#fff7f3",scale:1});
    const max=1200;let out=canvas;
    if(Math.max(canvas.width,canvas.height)>max){
      const ratio=max/Math.max(canvas.width,canvas.height);
      const c2=document.createElement("canvas");
      c2.width=Math.round(canvas.width*ratio);c2.height=Math.round(canvas.height*ratio);
      c2.getContext("2d").drawImage(canvas,0,0,c2.width,c2.height);
      out=c2;
    }
    return out.toDataURL("image/jpeg",0.55);
  }catch(e){return null;}
}
async function openFeedback(){
  const viewName=currentViewName();
  const shot=await captureScreenshot(); // vor dem Overlay erzeugen, damit das Overlay selbst nicht mit drauf ist
  FEEDBACK={screenshot:shot,view:viewName};
  renderFeedbackOverlay();
}
function closeFeedback(){FEEDBACK=null;renderFeedbackOverlay();}
function renderFeedbackOverlay(){
  const box=document.getElementById("feedbackoverlay");if(!box)return;
  if(!FEEDBACK){box.classList.add("hidden");box.innerHTML="";return;}
  box.classList.remove("hidden");
  box.innerHTML=`<div class="fbcard">
    <button class="fbclose" onclick="closeFeedback()">✕</button>
    <h2 style="font-size:16px">${t("fb_title")}</h2>
    ${FEEDBACK.screenshot?`<img src="${FEEDBACK.screenshot}" class="fbshot" alt="Screenshot"/>`:`<p class="muted sm">${t("fb_noshot")}</p>`}
    <textarea id="fbtext" rows="3" placeholder="${t("fb_ph")}"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn" onclick="sendFeedback()">${t("fb_send")}</button>
      <button class="btn ghost" onclick="closeFeedback()">${t("fb_cancel")}</button>
    </div>
  </div>`;
}
function feedbackQueue(){try{return JSON.parse(localStorage.getItem(FBQUEUE_KEY))||[];}catch(e){return [];}}
function saveFeedbackQueue(q){try{localStorage.setItem(FBQUEUE_KEY,JSON.stringify(q.slice(-20)));}catch(e){}}
async function sendFeedback(){
  const ta=document.getElementById("fbtext");const text=(ta&&ta.value||"").trim();
  if(!text){openModal(`<div class="emo">🐞</div><h2>${t("fb_need_text")}</h2><button class="btn block" onclick="closeModal()">${t("ok")}</button>`);return;}
  const report={ts:Date.now(),text,view:FEEDBACK.view,ua:navigator.userAgent,screen:innerWidth+"x"+innerHeight,
    niveau:S.user.niveau,streak:S.streak.aktuell,errors:getErrBuf(),screenshot:FEEDBACK.screenshot};
  closeFeedback();
  const q=feedbackQueue();q.push(report);saveFeedbackQueue(q);
  await flushFeedbackQueue(false);
}
async function reportToMail(report){
  if(!S.user.freundEmail||!S.user.w3key)return false;
  const errLines=report.errors.slice(-5).map(e=>`- [${e.type}] ${(e.message||"").slice(0,150)}`).join("\n")||"(none)";
  const body=`Feedback from Cœur·Lingo ${APP_VERSION}\n\n${report.text}\n\n---\nView: ${report.view}\nLevel: ${report.niveau} · Streak: ${report.streak}\nScreen: ${report.screen}\nBrowser: ${report.ua}\n\nRecent errors:\n${errLines}`;
  try{
    const fd=new FormData();
    fd.append("access_key",S.user.w3key);fd.append("subject","🐞 Cœur·Lingo feedback");
    fd.append("from_name","Cœur·Lingo");fd.append("email",S.user.freundEmail);fd.append("message",body);
    if(report.screenshot){const blob=await (await fetch(report.screenshot)).blob();fd.append("attachment",blob,"screenshot.jpg");}
    const res=await fetch("https://api.web3forms.com/submit",{method:"POST",body:fd});
    if(res.ok)return true;
  }catch(e){}
  try{ // Fallback: text-only (matches existing sendMail JSON pattern) if the attachment upload failed
    const res2=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
      body:JSON.stringify({access_key:S.user.w3key,subject:"🐞 Cœur·Lingo feedback",from_name:"Cœur·Lingo",message:body,email:S.user.freundEmail})});
    return res2.ok;
  }catch(e){return false;}
}
async function flushFeedbackQueue(silent){
  const q=feedbackQueue();if(!q.length)return;
  const remaining=[];
  for(const report of q){if(await reportToMail(report)){}else remaining.push(report);}
  saveFeedbackQueue(remaining);
  const sentCount=q.length-remaining.length;
  if(silent)return;
  if(sentCount>0)openModal(`<div class="emo">🐞</div><h2>${t("fb_sent")}</h2><p class="muted">${t("fb_sent_b")}</p><button class="btn block" onclick="closeModal()">${t("ok")}</button>`);
  else if(remaining.length)openModal(`<div class="emo">📭</div><h2>${t("fb_queued")}</h2><p class="muted">${t("fb_queued_b")}</p><button class="btn block" onclick="closeModal()">${t("ok")}</button>`);
}

/* ---------- Wort-Antippen (S8): antippbare DE-Wörter → lokales Wörterbuch → Cache → ⭐ ---------- */
const DICT=window.DICT_DE_EN||{};
/* Wörter (≥3 Buchstaben) in bereits escaptem Text antippbar machen. Läuft NACH esc(). */
function wordify(escapedText){
  return String(escapedText).replace(/([A-Za-zÄÖÜäöüß]{3,})/g,m=>`<span class="w" data-word="${m}">${m}</span>`);
}
/* Kaskade Stufe 1: lokales Wörterbuch, mit sanfter Suffix-Reduktion für flektierte Formen. */
function localLookup(word){
  const key=word.toLowerCase();
  if(DICT[key])return DICT[key];
  for(const suf of ["en","er","es","e","n","s"]){
    if(key.endsWith(suf)&&key.length>suf.length+2){
      const stem=key.slice(0,-suf.length);
      if(DICT[stem])return DICT[stem];
    }
  }
  return null;
}
/* EN→DE-Reverse-Index (lazy beim ersten Tap). Gloss-Zerlegung: Varianten an ,/;
   Klammern raus, führendes the/to/a/an strippen; Voll-Phrase exakt + Einzelwörter schwach indexiert. */
let DICT_EN=null;
const EN_STOP=new Set(["the","and","for","you","your","she","her","his","him","has","have","had","are","was","were","not","with","that","this","its","can","could","will","would","should","please","who","what","when","where","how","why","yes","our","their","them","they","one","all","any","but","from","into","out","off","too"]);
function buildEnIndex(){
  DICT_EN={};
  const add=(g,de,strong)=>{
    if(!g)return;
    (DICT_EN[g]=DICT_EN[g]||[]).push({de,strong});
  };
  for(const de in DICT){
    String(DICT[de]).split(/[,;]/).forEach(v=>{
      let g=v.replace(/\([^)]*\)/g,"").trim().toLowerCase();
      g=g.replace(/^(to|the|a|an)\s+/,"").trim();
      if(!g)return;
      add(g,de,true);
      g.split(/\s+/).forEach(w=>{if(w.length>=3&&w!==g&&!EN_STOP.has(w))add(w,de,false);});
    });
  }
}
/* Passt die DE-Variante in den Ziel-Satz? (Stamm-Präfix-Abgleich, flexionstolerant) */
function fitsTarget(de,targetLower){
  if(!targetLower)return false;
  return de.split(/\s+/).some(w=>{
    if(w.length<4)return false; // Mindestlänge gegen Kurzwort-Fehlalarme (z.B. "eis" in "teilweise")
    const stem=w.slice(0,Math.max(4,w.length-2));
    if(stem.length<4)return false;
    return new RegExp("\\b"+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(targetLower); // Wortgrenze statt freiem Substring
  });
}
function enVariants(word,target){
  if(!DICT_EN)buildEnIndex();
  const key=word.toLowerCase();
  let hits=DICT_EN[key]||[];
  if(!hits.length&&key.endsWith("s"))hits=DICT_EN[key.slice(0,-1)]||[]; // simple plural/3rd-person
  const targetLower=(target||"").toLowerCase();
  const seen=new Set(),out=[];
  hits.forEach(h=>{
    if(seen.has(h.de))return;seen.add(h.de);
    out.push({de:h.de,gloss:DICT[h.de],strong:h.strong,fit:fitsTarget(h.de,targetLower)});
  });
  out.sort((a,b)=>(b.fit-a.fit)||(b.strong-a.strong)||(a.de.length-b.de.length));
  return out.slice(0,6);
}
/* EN-Wörter im Übersetzen-Prompt antippbar machen. Läuft NACH esc(). */
function wordifyEn(escapedText){
  return String(escapedText).replace(/([A-Za-z]{3,})/g,m=>EN_STOP.has(m.toLowerCase())?m:`<span class="w" data-enword="${m}">${m}</span>`);
}
function openEnWordPopup(word){
  const clean=word.replace(/[^A-Za-z]/g,"");if(!clean)return;
  bumpCounter("lookups");save();
  const target=(SES&&SES.items&&SES.items[SES.si]&&SES.items[SES.si].de)||"";
  WORD_POPUP={word:clean,enMode:true,variants:enVariants(clean,target)};
  renderWordPopup();
}
let WORD_POPUP=null;
function openWordPopup(word){
  const clean=word.replace(/[^A-Za-zÄÖÜäöüß]/g,"");if(!clean)return;
  bumpCounter("lookups");save();
  const key=clean.toLowerCase();
  let en=localLookup(clean);            // Stufe 1: lokales Dict
  if(!en&&S.wordCache[key])en=S.wordCache[key]; // Stufe 2: Cache (frühere Treffer)
  WORD_POPUP={word:clean,en:en||null};
  renderWordPopup();
}
function closeWordPopup(){WORD_POPUP=null;renderWordPopup();}
function renderWordPopup(){
  const box=document.getElementById("wordpopup");if(!box)return;
  if(!WORD_POPUP){box.classList.add("hidden");box.innerHTML="";return;}
  const p=WORD_POPUP;box.classList.remove("hidden");
  if(p.enMode){
    const rows=p.variants.length?p.variants.map(v=>`<div class="envar${v.fit?' fit':''}">
        <div><b>${esc(v.de)}</b>${v.fit?`<span class="fitchip">✓ ${t("fits_sentence")}</span>`:""}<div class="muted sm">${esc(v.gloss)}</div></div>
        <button class="wpspk" onclick="speak(${q(v.de)})">🔊</button></div>`).join("")
      :`<div class="wptrans"><span class="muted">${t("no_en_entry")}</span></div>`;
    box.innerHTML=`<div class="wpcard">
      <button class="wpclose" onclick="closeWordPopup()">✕</button>
      <div class="wpword">${esc(p.word)}</div>${rows}</div>`;
    return;
  }
  const saved=!!S.customWords[p.word.toLowerCase()];
  box.innerHTML=`<div class="wpcard">
    <button class="wpclose" onclick="closeWordPopup()">✕</button>

function confetti(){
  const c=document.getElementById("confetti");c.classList.remove("hidden");
  const ctx=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#ff6b6b","#f4b942","#7b2d52","#28a878","#ff9eb5"];
  let P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,r:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],vy:2+Math.random()*4,vx:-2+Math.random()*4,a:Math.random()*6}));
  let f=0;(function loop(){ctx.clearRect(0,0,c.width,c.height);f++;P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore();});if(f<160)requestAnimationFrame(loop);else c.classList.add("hidden");})();
}

function startPlacement(){
  const src=[...INHALTE.luecken,...INHALTE.grammatik.flatMap(g=>g.items.map(it=>({options:it.options,answer:it.answer,lvl:g.lvl,satz:it.q})))];
  const pick=(lvl,n)=>shuffle(src.filter(x=>x.lvl===lvl&&x.satz)).slice(0,n);
  const qs=[...pick("A2",3),...pick("B1",3),...pick("B2",3)];
  PL={qs:shuffle(qs),i:0,c:{A2:0,B1:0,B2:0},tt:{A2:0,B1:0,B2:0}};
  renderPlacement();
}
function renderPlacement(){
  if(!PL||PL.i>=PL.qs.length){finishPlacement();return;}
  const it=PL.qs[PL.i];
  openModal(`<h3 class="center">${t("pl_q")} ${PL.i+1}/${PL.qs.length}</h3><div class="qtext">${esc(it.satz).replace("___","____")}</div>${it.options.map((o,k)=>`<button class="opt" onclick="plAns(${k})">${esc(o)}</button>`).join("")}`);
}
function plAns(k){const it=PL.qs[PL.i];PL.tt[it.lvl]++;if(k===it.answer)PL.c[it.lvl]++;PL.i++;renderPlacement();}
function finishPlacement(){
  const r=l=>PL.tt[l]?PL.c[l]/PL.tt[l]:0;let lvl="A2";
  if(r("A2")>=0.6&&r("B1")>=0.5)lvl="B1";
  if(lvl==="B1"&&r("B1")>=0.75&&r("B2")>=0.6)lvl="B2";
  S.user.niveau=lvl;
  if(lvl!=="A2")S.mastery.A2=LEVELUP_TH.A2;
  if(lvl==="B2")S.mastery.B1=LEVELUP_TH.B1;
  save();PL=null;
  openModal(`<div class="emo">🎯</div><h2>${t("levelWord")} ${lvl}</h2><p class="muted">${t("pl_done",lvl)}</p><button class="big-cta" onclick="closeModal();renderHeader();show('home')">${t("ob_go")}</button>`);
}

/* ---------- ⭐ Mein Training: Wiederholung gemerkter Wörter + Sätze ---------- */
function starPool(){
  const words=Object.entries(S.customWords||{}).map(([key,v])=>({type:"word",key,de:v.de,en:v.en}));
  const sents=Object.entries(S.customSentences||{}).map(([key,v])=>({type:"sentence",key,de:v.de,en:v.en}));
  return {words,sents};
}
function starPoolCount(){const {words,sents}=starPool();return words.length+sents.length;}
function startStarTraining(){
  const {words,sents}=starPool();
  const items=[...shuffle(words).slice(0,10),...shuffle(sents).slice(0,4)];
  if(!items.length)return;
  SES={plan:["starred"],bi:0,start:Date.now(),correct:0,total:0,items:shuffle(items),si:0,locked:false,leveledTo:null,theme:null,bonus:true};
  show("session");runBlock();
}

       <div class="face back"><div><div class="muted sm">Deutsch <span class="lvltag">${it.type==="word"?t("training_word"):t("training_sentence")}</span></div><div class="big">${wordify(esc(it.de))}</div></div></div>
     </div></div>
     <div class="center"><button class="spk" onclick="event.stopPropagation();speak(${q(it.de)})">${t("listen")}</button></div></div>
   <div class="row"><button class="btn ghost" onclick="starredNext()">${t("vocab_no")}</button><button class="btn" onclick="starredNext()">${t("vocab_yes")}</button></div>
   <button class="btn ghost block sm" style="margin-top:10px" onclick="forgetStarred()">${t("training_remove")}</button>`;
}
function starredNext(){
  if(SES.si<SES.items.length-1){SES.si++;renderStarred();}else{addXp(10);blockDone();}
}
function forgetStarred(){
  const it=SES.items[SES.si];
  if(it.type==="word")delete S.customWords[it.key];else delete S.customSentences[it.key];
  save();
  SES.items.splice(SES.si,1);
  if(!SES.items.length){blockDone();return;}
  if(SES.si>=SES.items.length)SES.si=SES.items.length-1;
  renderStarred();
}

/* ---------- record & compare (pronunciation) ---------- */
let REC=null,recURL=null;
async function toggleRecord(btn){
  try{
    if(REC&&REC.state==="recording"){REC.stop();return;}
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[];REC=new MediaRecorder(stream);
    REC.ondataavailable=e=>chunks.push(e.data);
    REC.onstop=()=>{if(recURL)URL.revokeObjectURL(recURL);recURL=URL.createObjectURL(new Blob(chunks));stream.getTracks().forEach(x=>x.stop());const p=document.getElementById("playmine");if(p)p.classList.remove("hidden");if(btn)btn.textContent=t("record");};
    REC.start();btn.textContent=t("stop_record");
  }catch(e){alert(t("mic_denied"));}
}
function playMine(){if(recURL){try{new Audio(recURL).play();}catch(e){}}}

/* ---------- boot ---------- */
function boot(){
  mergeI18nEN();applyThemaTags();
  if(!S){onboarding();return;}
  if(!S.mistakes)S.mistakes=[];
  if(!S.user.lang)S.user.lang="en";
  if(!S.customWords)S.customWords={};
  if(!S.customSentences)S.customSentences={};
  if(S.streak.abgerechnetBis==null)S.streak.abgerechnetBis="";
  if(!S.wordCache)S.wordCache={};
  if(!S.counters)S.counters={};
  if(!S.eggs)S.eggs={revealed:{},goldDate:"",owl:false};
  reconcileStreak();rolloverXp();advanceLiga();ensureChecklist();weeklyReportIfDue();renderHeader();show("home");
}
boot();
setTimeout(()=>{if(S)flushFeedbackQueue(true);},1800); // stiller Retry für wartende Feedback-Reports
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
